<div class="col-md-6 offset-md-3">
    <h3> Update Food </h3>
    <form (ngSubmit) = "onSubmit()">
    
        <div class="form-group">
            <label> Food Name</label>
            <input type="text" class ="form-control" id = "name"
                [(ngModel)] = "food.name" name = "userName">
        </div>
    
        <div class="form-group">
            <label> Description</label>
            <input type="text" class ="form-control" id = "description"
                [(ngModel)] = "food.description" name = "description">
        </div>
    
        <div class="form-group">
            <label> Type</label>
            <input type="text" class ="form-control" id = "type"
                [(ngModel)] = "food.type" name = "type">
        </div>
        <div class="form-group">
            <label> Cuisine Name</label>
            <input type="text" class ="form-control" id = "cuisine_name"
                [(ngModel)] = "food.cuisine_name" name = "cuisine_name">
        </div>
        <div class="form-group">
            <label> Cuisine Name</label>
            <input type="text" class ="form-control" id = "price"
                [(ngModel)] = "food.price" name = "price">
        </div>
    
        <button class = "btn btn-success mt-3" type ="submit">Submit</button>
    
    </form>
    <button routerLink="/menuop" class="btn btn-primary mt-3">Back</button>
    </div>
