<div class="container">
    <div class="row">
        <div class="col-md-5">
            <div class="card"> 
                <div class="text-center">
                    <h2>Log in</h2>
                </div>
                <form >
                    <form [formGroup]="loginform" (ngSubmit)="login()">
                        <div class="mb-3">
                          <label class="form-label">Email address</label>
                          <input formControlName="adminEmail" [(ngModel)]="admin.userEmail" type="email" class="form-control" id="userEmail"required>                       
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Password</label>
                          <input  formControlName="adminpassword" [(ngModel)]="admin.password" type="password" id="password" class="form-control"required >
                        </div>
                        <div class="mb-3 form-check">
                          <input type="checkbox" class="form-check-input"required >
                          <label class="form-check-label" for="exampleCheck1">Check me out</label>
                        </div>
                        <button type="submit" class="btn btn-primary mb-2">Sign in</button>
                      </form>
                      <a style="color:#fff; margin-top:30px;" routerLink="/adminreg">New Admin?</a>                      
                </form>
                <div >
                    <button style="margin-left: 160px;" routerLink="/login" class="btn btn-primary">I am User</button>
                </div>
            </div>
        </div>
    </div>
</div>
