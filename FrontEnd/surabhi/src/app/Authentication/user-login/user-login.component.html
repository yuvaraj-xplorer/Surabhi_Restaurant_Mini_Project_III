<div class="container">
    <div class="row">
        <div class="col-md-5">
            <div class="card">
                <div class="text-center">
                    <h2>Log in</h2>
                </div>
                <form>
                    <form [formGroup]="loginform" (ngSubmit)="login()">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input formControlName="userEmail" type="email" [(ngModel)]="user.userEmail" class="form-control" id="userEmail"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input formControlName="password"[(ngModel)]="user.password" type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" required>
                            <label class="form-check-label" for="exampleCheck1">Check me out</label>
                        </div>
                        <button type="submit" class="btn btn-primary mb-2">Sign in</button>
                    </form>
                    <a style="color:#fff; margin-top:30px;" routerLink="/signup">New user?</a>
                </form>
                <div>
                    <button style="margin-left: 160px;" routerLink="/adminlog" class="btn btn-primary"><i
                            class="fas fa-users-cog"></i><br>Admin</button>
                </div>
            </div>
        </div>
    </div>
</div>
